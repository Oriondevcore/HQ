<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION DEV CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0A0A0B; color: #E5E5E5; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glow { text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .grid-bg {
            background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px),
                              linear-gradient(to bottom, #1a1a1a 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="grid-bg">

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="mono text-xl font-bold tracking-tighter">ORION <span class="text-gray-500">DEV CORE</span></div>
        <button class="mono text-sm border border-gray-700 px-4 py-2 hover:bg-white hover:text-black transition-all">CONNECT_UPLINK</button>
    </nav>

    <section class="h-[80vh] flex flex-col justify-center items-center text-center px-4">
        <p class="mono text-sm tracking-widest text-gray-400 mb-4 uppercase tracking-[0.3em]">Building the Next Generation</p>
        <h1 class="text-6xl md:text-8xl font-black mb-6 glow tracking-tighter italic">AI AMPLIFIES. <br>I CREATE.</h1>
        <p class="max-w-xl text-gray-400 text-lg mb-10">We build intelligent systems that simplify work, protect trust, and scale human capability.</p>
        
        <div class="flex flex-col md:flex-row gap-4">
            <button class="bg-white text-black px-8 py-4 font-bold mono hover:bg-gray-200 transition-all">SPEAK_TO_ORION_LIVE</button>
            <button class="border border-gray-700 px-8 py-4 font-bold mono hover:bg-gray-800 transition-all">SEE_HOW_IT_WORKS</button>
        </div>
    </section>

    <div class="max-w-5xl mx-auto p-10 bg-black/50 border border-gray-800 backdrop-blur-md mb-20">
        <div class="mono text-xs text-green-500 mb-4">[ STATUS: ARCHITECT_ONLINE ]</div>
        <div class="text-xl mono mb-4">"Welcome to Orion Dev Core. Tell me what kind of business you run, and I’ll design your automation stack."</div>
        <input type="text" placeholder="Type business sector..." class="w-full bg-transparent border-b border-gray-700 p-2 mono outline-none focus:border-white transition-all">
    </div>

</body>
</html>
